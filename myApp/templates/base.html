{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Hammer Group{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="{% static 'hammer_icon.jpg' %}" />
  <link rel="apple-touch-icon" href="{% static 'hammer_icon.jpg' %}" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% block og_title %}Hammer Group - Luxury Villa Construction, Landscaping & Interior Design{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}Premier construction, landscaping, and interior design services in Dubai. Transforming visions into exceptional living spaces.{% endblock %}" />
  <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'hammer_icon.jpg' %}{% endblock %}" />
  <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}Hammer Group - Luxury Villa Construction, Landscaping & Interior Design{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}Premier construction, landscaping, and interior design services in Dubai. Transforming visions into exceptional living spaces.{% endblock %}" />
  <meta name="twitter:image" content="{% block twitter_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'hammer_icon.jpg' %}{% endblock %}" />

  <!-- Tailwind CDN (v4) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

  <!-- Hammer tokens & small tweaks (must be AFTER Tailwind) -->
  <link href="{% static 'css/hammer.css' %}" rel="stylesheet">

  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans text-hammer-ink bg-white antialiased">
  

  {% include "header.html" %}
  {% include "partials/wattsapp.html" %}
  <main class="pt-20">{% block content %}{% endblock %}</main>
  {% include "footer.html" %}
</body>
</html>
